openapi: 3.1.0
info:
  title: Luma Dream Machine Concepts System API
  description: 'REST API for Luma''s Dream Machine generative video and image platform.

    Submit a generation request, then poll for its status by ID. Resources

    include video generations (Ray models), image generations (Photon),

    upscale, modify (style transfer), reframe, audio attachment, credits,

    and concepts.

    Authentication uses Bearer tokens obtained from

    https://lumalabs.ai/dream-machine/api/keys.

    '
  version: '1.0'
  contact:
    name: Luma Labs
    url: https://docs.lumalabs.ai/
  license:
    name: Proprietary
    url: https://lumalabs.ai/legal/tos
servers:
- url: https://api.lumalabs.ai/dream-machine/v1
  description: Dream Machine API
security:
- BearerAuth: []
tags:
- name: System
paths:
  /ping:
    get:
      tags:
      - System
      summary: Health check
      operationId: ping
      responses:
        '200':
          description: Pong
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
